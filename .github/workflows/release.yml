name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    outputs:
      publish_pages: ${{ steps.release_metadata.outputs.publish_pages }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Determine release metadata
        id: release_metadata
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "publish_pages=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "publish_pages=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/krypton
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build package
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: dist
          if-no-files-found: error

      - name: Publish package to npm
        run: npm publish --provenance --access public --tag ${{ steps.release_metadata.outputs.npm_tag }}

      - name: Prepare GitHub Pages artifact
        if: ${{ steps.release_metadata.outputs.publish_pages == 'true' }}
        run: |
          mkdir -p pages
          cp -r src/main/resources/* pages/
          cp dist/bundle.head.json pages/
          cp dist/bundle.json pages/

      - name: Upload GitHub Pages artifact
        if: ${{ steps.release_metadata.outputs.publish_pages == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          files: dist/*

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    if: ${{ needs.release.outputs.publish_pages == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
